# =============================================================================
# 天玑档案管理系统 · 内核参数（ES 启动硬门槛）
#
# 由安装器复制到 /etc/sysctl.d/99-tianji.conf 并执行 `sysctl --system` 生效。
# 文件名前缀固定 99-tianji，卸载时按此精确移除，不触碰同目录其他文件。
#
# 为什么是这三条（docs/安装器总体设计.md §4.5 K5）：
#   vm.max_map_count  —— elasticsearch 8 使用 mmap 打开 Lucene 段文件，默认 65530
#                        在日志量稍大时直接 "max virtual memory areas ... too low"
#                        然后容器退出。docker-compose.offline.yml 里 ES 还开了
#                        bootstrap.memory_lock: true，这条不够会连锁失败。
#   fs.file-max       —— 8 个容器 + ES 段文件 + PG 连接，句柄量远超默认。
#   vm.swappiness     —— 数据库与搜索引擎不应被换出，否则 ES 查询毛刺、PG 抖动。
# =============================================================================

# Lucene / ES 必需（硬门槛，低于此值 ES 起不来）
vm.max_map_count = 262144

# 全系统文件句柄上限（配合 limits.d 的 nofile）
fs.file-max = 655360

# 尽量不用 swap（ES 与 PG 对换出极敏感）
vm.swappiness = 1
