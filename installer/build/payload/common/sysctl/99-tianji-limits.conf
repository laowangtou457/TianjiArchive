# =============================================================================
# 天玑档案管理系统 · 进程资源限制（ES 锁内存与句柄数）
#
# 由安装器复制到 /etc/security/limits.d/99-tianji-limits.conf。
# 设计文档 §2.1 只列了 sysctl/99-tianji.conf，本文件是同一目的的第二处落盘
# （§4.5 K6/K7：memlock 必须 unlimited，nofile 必须 >= 65535），故并列放在
# sysctl/ 目录下，命名带 -limits 以示区别；卸载时两个文件一起精确移除。
#
# 注意：limits.d 只对「登录会话」生效，容器内限制由 dockerd 传递，
# 因此安装器还会在同一次执行里对 dockerd 的 systemd unit 设置
# LimitMEMLOCK=infinity（见 dockerinstall 模块），两处缺一不可。
# =============================================================================

*    soft    memlock     unlimited
*    hard    memlock     unlimited
*    soft    nofile      65535
*    hard    nofile      65535

root soft    memlock     unlimited
root hard    memlock     unlimited
root soft    nofile      65535
root hard    nofile      65535
