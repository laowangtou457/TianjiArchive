# ============================================================================
# 天玑档案管理系统本地复刻 —— Docker Compose 一键编排
# 服务：web(nginx) / api / extractor / postgres / elasticsearch(IK) / seaweedfs(S3) / redis / backup sidecar
# 说明：数据卷独立目录，便于挂载 NAS；生产请替换 .env 中所有 change_me 密码。
# 对象存储：MinIO 开源版归档停服（Docker Hub 仓库消失 + dl.min.io 410），
#          改用 SeaweedFS S3 Gateway（方案 A）。应用侧仍用 minio npm SDK 走 S3 协议，
#          MINIO_* 环境变量名保持不变以兼容 configuration.ts / cli-migrator / extractor / backup.sh。
#
# R-1 双端点：预签名 URL 由 S3_PUBLIC_*（浏览器可达，默认 127.0.0.1:8333）签发，
#   服务端 S3 操作走内部 MINIO_ENDPOINT=seaweedfs:8333。封闭环境把 S3_PUBLIC_ENDPOINT
#   改成宿主机局域网 IP（见 .env.example）。
# R-2 端口：SeaweedFS 宿主只发布 8333；volume 8081 / filer 8888 / master 9333 /
#   gRPC 端口一律不发布宿主；原 9001 MinIO Console 端口已移除。
# R-3 建桶：无 minio-init，桶由 API 的 MinioService.onModuleInit → ensureBuckets() 单点创建；
#   自动建桶由 infra/seaweedfs/s3.json.tpl 的桶级 identity 收权（3.79 无 autoCreateBucket flag）。
# ============================================================================
name: tianji-archive

x-common-env: &common-env
  TZ: ${TZ:-Asia/Shanghai}
  NODE_ENV: ${NODE_ENV:-production}

x-db-env: &db-env
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_DB: ${POSTGRES_DB:-tianji_archive}
  POSTGRES_USER: ${POSTGRES_USER:-tianji}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tianji_pwd_change_me}

x-infra-env: &infra-env
  ES_NODE: ${ES_NODE:-http://elasticsearch:9200}
  ES_INDEX: ${ES_INDEX:-archive_items}
  # S3 兼容端点（实现为 SeaweedFS S3 Gateway；MINIO_* 变量名保留以兼容存量代码）
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-seaweedfs}
  MINIO_PORT: ${MINIO_PORT:-8333}
  MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-tianji_minio}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-tianji_minio_change_me}
  MINIO_BUCKET_ORIGINAL: ${MINIO_BUCKET_ORIGINAL:-archive-original}
  MINIO_BUCKET_PREVIEW: ${MINIO_BUCKET_PREVIEW:-archive-preview}
  MINIO_BUCKET_THUMB: ${MINIO_BUCKET_THUMB:-archive-thumb}
  MINIO_BUCKET_BACKUP: ${MINIO_BUCKET_BACKUP:-archive-backup}
  # R-1：仅有 API 用它签发预签名 URL；extractor/backup 忽略即可（多传无害）。
  # demo 默认 127.0.0.1（浏览器与 Docker 同机）；封闭环境改成宿主机局域网 IP。
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-127.0.0.1}
  S3_PUBLIC_PORT: ${S3_PUBLIC_PORT:-8333}
  S3_PUBLIC_USE_SSL: ${S3_PUBLIC_USE_SSL:-false}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_DB: ${REDIS_DB:-0}

services:
  # ------------------------------------------------------------------ PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: tianji-postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_DB: ${POSTGRES_DB:-tianji_archive}
      POSTGRES_USER: ${POSTGRES_USER:-tianji}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tianji_pwd_change_me}
      # WAL 归档，支撑 RPO<=24h
      POSTGRES_INITDB_ARGS: '--data-checksums'
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /wal_archive/%f && cp %p /wal_archive/%f
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
      - ./volumes/wal_archive:/wal_archive
    ports:
      - '${POSTGRES_EXPOSED_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tianji} -d ${POSTGRES_DB:-tianji_archive}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tianji-net

  # ------------------------------------------------------------------ Elasticsearch 8 + IK
  elasticsearch:
    build:
      context: ./infra/elasticsearch
      dockerfile: Dockerfile
      args:
        ES_VERSION: ${ES_VERSION:-8.13.4}
        IK_VERSION: ${IK_VERSION:-8.13.4}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: tianji-elasticsearch-ik:8.13.4
    container_name: tianji-elasticsearch
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms1g -Xmx1g}
      bootstrap.memory_lock: 'true'
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ./volumes/esdata:/usr/share/elasticsearch/data
    ports:
      - '${ES_EXPOSED_PORT:-9200}:9200'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9200/_cluster/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      - tianji-net

  # ------------------------------------------------------------------ SeaweedFS S3 Gateway（MinIO 替代，方案 A）
  # image-only：chrislusf/seaweedfs:3.79 已实拉 digest sha256:21425305…；封闭环境不 build、不联网。
  # 凭据/桶名注入：s3.json.tpl 是**模板**（无密钥/无硬编码桶名），entrypoint.sh 在容器启动时
  #   用 MINIO_ACCESS_KEY / MINIO_SECRET_KEY / MINIO_BUCKET_* 渲染到 /tmp（不入库、不落镜像、
  #   不写进持久卷），再委派内置 /entrypoint.sh 的 server 分支启动（继承调优参数）。
  # R-3 关闭自动建桶：3.79 无 flag，改由 s3.json 桶级 identity 收权（无全局 Admin）。
  # healthcheck：镜像内无 curl，用 busybox wget；同时验 master 9333/cluster/status（leader 就绪）
  #   与 S3 8333（匿名 GET / 返回 403 恰说明「S3 网关已起且鉴权生效」，200/403 均视为健康）。
  #   ——两条都要过，既响应架构师对 9333 的建议，也确保 8333 这一实际依赖真正可用。
  seaweedfs:
    image: chrislusf/seaweedfs:3.79
    container_name: tianji-seaweedfs
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/scripts/entrypoint.sh']
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-tianji_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-tianji_minio_change_me}
      MINIO_BUCKET_ORIGINAL: ${MINIO_BUCKET_ORIGINAL:-archive-original}
      MINIO_BUCKET_PREVIEW: ${MINIO_BUCKET_PREVIEW:-archive-preview}
      MINIO_BUCKET_THUMB: ${MINIO_BUCKET_THUMB:-archive-thumb}
      MINIO_BUCKET_BACKUP: ${MINIO_BUCKET_BACKUP:-archive-backup}
    volumes:
      - ./volumes/seaweedfs:/data
      - ./infra/seaweedfs/entrypoint.sh:/scripts/entrypoint.sh:ro
      - ./infra/seaweedfs/s3.json.tpl:/scripts/s3.json.tpl:ro
    ports:
      # R-2：宿主只发布 S3(8333)。master 9333 / filer 8888 / volume 8081 / gRPC 端口
      # 全部只在容器网络内可达（避免与 web 宿主 8080 冲突，也收敛攻击面）。
      - '${SEAWEEDFS_S3_EXPOSED_PORT:-8333}:8333'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O - http://127.0.0.1:9333/cluster/status 2>/dev/null | grep -q IsLeader && wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -qE "HTTP/1\.[01] (200|403)" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - tianji-net

  # ------------------------------------------------------------------ Redis 7
  redis:
    image: redis:7-alpine
    container_name: tianji-redis
    restart: unless-stopped
    command: >
      redis-server --appendonly yes
      --maxmemory 512mb --maxmemory-policy noeviction
    # noeviction 是裁定口径（同 ccbebc2）：档案系统不许静默驱逐键，
    # 内存压力显式报错 fail-closed；与离线交付 compose 保持一致。
    volumes:
      - ./volumes/redis:/data
    ports:
      - '${REDIS_EXPOSED_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tianji-net

  # ------------------------------------------------------------------ API（NestJS）
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: tianji-archive-api:1.0.0
    container_name: tianji-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: [*common-env, *db-env, *infra-env]
      API_PORT: ${API_PORT:-3000}
      API_PREFIX: ${API_PREFIX:-api}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-please_change_this_access_secret_32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-please_change_this_refresh_secret_32chars}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-2h}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-14d}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}
      PWD_MIN_LENGTH: ${PWD_MIN_LENGTH:-10}
      PWD_EXPIRE_DAYS: ${PWD_EXPIRE_DAYS:-90}
      PWD_MAX_FAILED: ${PWD_MAX_FAILED:-5}
      PWD_LOCK_MINUTES: ${PWD_LOCK_MINUTES:-30}
      PREVIEW_WATERMARK: ${PREVIEW_WATERMARK:-true}
      DOWNLOAD_ENABLED: ${DOWNLOAD_ENABLED:-false}
      EXTRACT_QUEUE_NAME: ${EXTRACT_QUEUE_NAME:-archive-extract}
    ports:
      - '${API_EXPOSED_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/api/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - tianji-net

  # ------------------------------------------------------------------ Extractor Worker
  extractor:
    build:
      context: .
      dockerfile: apps/extractor/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: tianji-archive-extractor:1.0.0
    container_name: tianji-extractor
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 桶由 API 的 MinioService.onModuleInit → ensureBuckets() 幂等创建。
      # extractor 只在 API 处理上传后收到队列任务；api healthy 意味着
      # 桶初始化已完成（health 的 objectStorage 检查即 bucketExists），
      # 故以依赖顺序消除「桶未建好就取对象」的启动竞争。
      api:
        condition: service_healthy
    environment:
      <<: [*common-env, *db-env, *infra-env]
      EXTRACT_CONCURRENCY: ${EXTRACT_CONCURRENCY:-4}
      EXTRACT_QUEUE_NAME: ${EXTRACT_QUEUE_NAME:-archive-extract}
      OFFICE_SOFFICE_PATH: ${OFFICE_SOFFICE_PATH:-/usr/bin/soffice}
      FFMPEG_PATH: ${FFMPEG_PATH:-/usr/bin/ffmpeg}
      THUMB_MAX_EDGE: ${THUMB_MAX_EDGE:-480}
    networks:
      - tianji-net

  # ------------------------------------------------------------------ Web (Nginx + SPA)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: tianji-archive-web:1.0.0
    container_name: tianji-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - '${WEB_PORT:-8080}:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1/healthz || exit 1']
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - tianji-net

  # ------------------------------------------------------------------ 备份 sidecar（cron 每日 02:00）
  backup:
    build:
      context: ./infra/backup
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: tianji-archive-backup:1.0.0
    container_name: tianji-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      # 同 extractor：backup 启动即跑一次全量备份，必须等 API 建桶完成。
      # 另在 backup.sh 内做有上限的 head-bucket 重试，双保险，失败显式报错
      # （MINIO_STATUS=FAILED + 日志），绝不静默 SKIPPED。
      api:
        condition: service_healthy
    environment:
      <<: [*common-env, *db-env]
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-seaweedfs}
      MINIO_PORT: ${MINIO_PORT:-8333}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-tianji_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-tianji_minio_change_me}
      MINIO_BUCKET_BACKUP: ${MINIO_BUCKET_BACKUP:-archive-backup}
      MINIO_BUCKET_ORIGINAL: ${MINIO_BUCKET_ORIGINAL:-archive-original}
      # aws-cli 侧：端点/凭据由 MINIO_* 单一来源派生（见 backup.sh 顶部兜底）
      AWS_ENDPOINT_URL: http://${MINIO_ENDPOINT:-seaweedfs}:${MINIO_PORT:-8333}
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-tianji_minio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-tianji_minio_change_me}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_DIR: ${BACKUP_DIR:-/backup}
    volumes:
      - ./volumes/backup:/backup
    networks:
      - tianji-net

networks:
  tianji-net:
    driver: bridge

volumes:
  postgres_data:
  esdata:
  seaweedfs_data:
  redis_data:
